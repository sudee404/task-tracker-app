[project]
name = "task-tracker-backend"
version = "0.1.0"
description = "Django + DRF API for the team task tracker"
requires-python = ">=3.11"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15",
    "django-filter>=24.3",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings_test"
python_files = ["test_*.py"]
addopts = "-q"
